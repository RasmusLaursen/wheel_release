name: Validate wheel_test version bump

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
 
permissions:
  contents: read
 
concurrency:
  group: wheel-test-version-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
 
jobs:
  validate:
    name: Validate wheel_test version bump
    runs-on: ubuntu-latest
 
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
 
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
 
      - name: Validate version bump
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          uv run --with packaging python - <<'PY'
          import os
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          from packaging.version import InvalidVersion, Version


          def git_output(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True)


          def project_version(pyproject_content: str) -> Version:
              version = tomllib.loads(pyproject_content)["project"]["version"]
              try:
                  return Version(version)
              except InvalidVersion as exc:
                  raise SystemExit(f"Invalid project.version {version!r}: {exc}") from exc


          def find_bundles() -> list[Path]:
              """Discover DAB directories: top-level dirs containing both pyproject.toml and databricks.yml."""
              root = Path(".")
              return [
                  d for d in root.iterdir()
                  if d.is_dir()
                  and (d / "pyproject.toml").exists()
                  and (d / "databricks.yml").exists()
              ]


          def bundle_affected_files(bundle: Path, changed_files: list[str]) -> list[str]:
              prefix = f"{bundle.name}/"
              return [
                  path for path in changed_files
                  if (path.startswith(prefix) and not path.startswith(f"{bundle.name}/tests/"))
                  or path == f"{bundle.name}/pyproject.toml"
                  or path == f"{bundle.name}/databricks.yml"
                  or path.startswith(".github/workflows/")
              ]


          base_sha = os.environ["BASE_SHA"]
          changed_files = git_output("diff", "--name-only", f"{base_sha}...HEAD").splitlines()

          bundles = find_bundles()
          if not bundles:
              print("No DAB bundles found in repository root.")
              sys.exit(0)

          failed = []

          for bundle in sorted(bundles):
              affected = bundle_affected_files(bundle, changed_files)
              if not affected:
                  print(f"[{bundle.name}] No release-affecting files changed. Skipping.")
                  continue

              print(f"\n[{bundle.name}] Release-affecting files changed:")
              for path in affected:
                  print(f"  - {path}")

              pyproject_path = bundle / "pyproject.toml"
              try:
                  base_pyproject = git_output("show", f"{base_sha}:{pyproject_path}")
              except subprocess.CalledProcessError:
                  print(f"[{bundle.name}] WARNING: {pyproject_path} not found in base commit — skipping version check.")
                  continue

              head_pyproject = pyproject_path.read_text(encoding="utf-8")
              base_version = project_version(base_pyproject)
              head_version = project_version(head_pyproject)

              print(f"[{bundle.name}] Base version: {base_version}")
              print(f"[{bundle.name}] Head version: {head_version}")

              if head_version <= base_version:
                  print(f"[{bundle.name}] ERROR: version must increase (base={base_version}, head={head_version})")
                  failed.append(bundle.name)
              else:
                  print(f"[{bundle.name}] Version bump is valid.")

          if failed:
              raise SystemExit(
                  f"The following bundles have release-affecting changes but no version bump: {', '.join(failed)}\n"
                  "Increase project.version in each bundle's pyproject.toml."
              )
          PY