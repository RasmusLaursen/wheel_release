name: Deploy DAB

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (dev only)'
        required: true
        type: choice
        options:
          - dev
      bundle_path:
        description: 'Bundle directory name to deploy (e.g. wheel_test)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wheel-test-release-${{ github.event_name == 'release' && github.ref || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: false

jobs:
  validate_tag:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      dab_name: ${{ steps.parse.outputs.dab_name }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Parse and validate release tag
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"

          if ! [[ "$TAG" =~ ^([a-zA-Z0-9_]+)-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Tag '$TAG' does not match expected format '<dab_name>-X.Y.Z'" >&2
            exit 1
          fi

          DAB_NAME="${BASH_REMATCH[1]}"
          VERSION="${BASH_REMATCH[2]}"
          echo "dab_name=$DAB_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Parsed DAB: $DAB_NAME, version: $VERSION"

      - name: Validate tag version matches pyproject.toml
        shell: bash
        run: |
          set -euo pipefail
          PYPROJECT_VERSION=$(python -c "import tomllib; from pathlib import Path; print(tomllib.load(Path('${{ steps.parse.outputs.dab_name }}/pyproject.toml').open('rb'))['project']['version'])")
          TAG_VERSION="${{ steps.parse.outputs.version }}"

          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: pyproject.toml has '$PYPROJECT_VERSION' but tag is '$TAG_VERSION'" >&2
            exit 1
          fi
          echo "Version '$TAG_VERSION' matches pyproject.toml"

  deploy_prod:
    needs: validate_tag
    if: github.event_name == 'release'
    uses: ./.github/workflows/deploy_bundle.yml
    name: Deploy prod
    with:
      environment: prod
      bundle_path: ${{ needs.validate_tag.outputs.dab_name }}
    secrets: inherit

  deploy_manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy_bundle.yml
    name: Deploy ${{ github.event.inputs.environment }}
    with:
      environment: ${{ github.event.inputs.environment }}
      bundle_path: ${{ github.event.inputs.bundle_path }}
    secrets: inherit