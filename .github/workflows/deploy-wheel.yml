name: Deploy wheel_test

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

concurrency:
  group: wheel-test-release-${{ github.event_name == 'release' && github.ref || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: false

jobs:
  validate_tag:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Parse and validate release tag
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"

          if ! [[ "$TAG" =~ ^wheel_test-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Tag '$TAG' does not match expected format 'wheel_test-X.Y.Z'" >&2
            exit 1
          fi

          VERSION="${BASH_REMATCH[1]}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Parsed version: $VERSION"

      - name: Validate tag version matches pyproject.toml
        shell: bash
        run: |
          set -euo pipefail
          PYPROJECT_VERSION=$(python -c "import tomllib; from pathlib import Path; print(tomllib.load(Path('wheel_test/pyproject.toml').open('rb'))['project']['version'])")
          TAG_VERSION="${{ steps.parse.outputs.version }}"

          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: pyproject.toml has '$PYPROJECT_VERSION' but tag is '$TAG_VERSION'" >&2
            exit 1
          fi
          echo "Version '$TAG_VERSION' matches pyproject.toml"

  deploy_prod:
    needs: validate_tag
    if: github.event_name == 'release'
    uses: ./.github/workflows/deploy_bundle.yml
    name: Deploy prod
    with:
      environment: prod
      bundle_path: wheel_test
    secrets: inherit

  deploy_manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy_bundle.yml
    name: Deploy ${{ github.event.inputs.environment }}
    with:
      environment: ${{ github.event.inputs.environment }}
      bundle_path: wheel_test
    secrets: inherit