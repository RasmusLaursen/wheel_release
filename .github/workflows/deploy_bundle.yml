name: Deploy Databricks bundle

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (dev, prod)'
        required: true
        type: string
      bundle_path:
        description: 'Path to the bundle directory relative to repo root'
        required: false
        default: 'wheel_test'
        type: string
      volume_catalog:
        description: 'Catalog containing the release volume'
        required: false
        default: 'shared'
        type: string
      volume_schema:
        description: 'Schema containing the release volume'
        required: false
        default: 'bundle_artifacts'
        type: string
      volume_name:
        description: 'Volume storing release wheels'
        required: false
        default: 'wheel_release'
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ fromJson(vars.workspace_setup)[inputs.environment].host }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      VOLUME_CATALOG: ${{ inputs.volume_catalog }}
      VOLUME_SCHEMA: ${{ inputs.volume_schema }}
      VOLUME_NAME: ${{ inputs.volume_name }}

    steps:
      - name: Validate workspace_setup contains target environment
        shell: bash
        run: |
          set -euo pipefail
          HOST='${{ fromJson(vars.workspace_setup)[inputs.environment].host }}'
          if [ -z "$HOST" ]; then
            echo "vars.workspace_setup does not contain a host for environment '${{ inputs.environment }}'" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      # uv is required by the bundle's artifacts section to build the wheel during deploy
      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1.3.0

      - name: Read release version from pyproject.toml
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; from pathlib import Path; print(tomllib.load(Path('${{ inputs.bundle_path }}/pyproject.toml').open('rb'))['project']['version'])")
          echo "release_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Deploy app bundle
        working-directory: ${{ inputs.bundle_path }}
        env:
          BUNDLE_VAR_release_version: ${{ steps.version.outputs.release_version }}
          BUNDLE_VAR_volume_catalog: ${{ inputs.volume_catalog }}
          BUNDLE_VAR_volume_schema: ${{ inputs.volume_schema }}
          BUNDLE_VAR_volume_name: ${{ inputs.volume_name }}
          BUNDLE_VAR_run_as: ${{ fromJson(vars.workspace_setup)[inputs.environment]['service-principal'] }}
        shell: bash
        run: databricks bundle deploy --target ${{ inputs.environment }}