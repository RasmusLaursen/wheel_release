# This is a Databricks asset bundle definition for pydabs_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: pydabs_project
  uuid: 39fbc5ef-ca06-49d0-b838-8a4293e8d879

python:
  venv_path: .venv
  # Functions called to load resources defined in Python. See resources/__init__.py
  resources:
    - "resources:load_resources"

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  release_version:
    description: Release version used for the deployed wheel path
    default: 0.0.1
  volume_catalog:
    description: Catalog that contains the shared release volume
    default: shared
  volume_schema:
    description: Schema that contains the shared release volume
    default: bundle_artifacts
  volume_name:
    description: Volume that stores released wheel files
    default: wheel_release
  run_as:
    description: Service principal name used as run_as identity for production deployments

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-e3d11267-f1e6.cloud.databricks.com
      root_path: /Workspace/Shared/${workspace.current_user.short_name}/.bundle/${bundle.name}/${bundle.target}
      artifact_path: /Volumes/${var.volume_catalog}/${var.volume_schema}/${var.volume_name}/${bundle.name}/${var.release_version}/bundle-artifacts
    variables:
      catalog: raw_dev
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-e3d11267-f1e6.cloud.databricks.com
      root_path: /Workspace/Users/rasmuslaursen@live.dk/.bundle/${bundle.name}/${bundle.target}
      artifact_path: /Volumes/${var.volume_catalog}/${var.volume_schema}/${var.volume_name}/${bundle.name}/${var.release_version}/bundle-artifacts
    variables:
      catalog: raw_dev
      schema: prod
    permissions:
      - user_name: rasmuslaursen@live.dk
        level: CAN_MANAGE
