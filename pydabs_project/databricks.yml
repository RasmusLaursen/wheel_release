# This is a Databricks asset bundle definition for pydabs_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: pydabs_project
  uuid: 39fbc5ef-ca06-49d0-b838-8a4293e8d879

python:
  venv_path: .venv
  # Functions called to load resources defined in Python. See resources/__init__.py
  resources:
    - "resources:load_resources"

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-e3d11267-f1e6.cloud.databricks.com
    variables:
      catalog: raw_dev
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-e3d11267-f1e6.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/rasmuslaursen@live.dk to make sure we only have a single copy.
      root_path: /Workspace/Users/rasmuslaursen@live.dk/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: raw_dev
      schema: prod
    permissions:
      - user_name: rasmuslaursen@live.dk
        level: CAN_MANAGE
