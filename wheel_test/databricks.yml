# This is a Databricks asset bundle definition for wheel_test.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: wheel_test
  databricks_cli_version: "== 1.3.0"
  uuid: 8d81f940-ddb1-4128-818e-6d2b45e985e3

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  release_version:
    description: Release version used for the deployed wheel path
    default: 0.0.1
  volume_catalog:
    description: Catalog that contains the shared release volume
    default: shared
  volume_schema:
    description: Schema that contains the shared release volume
    default: bundle_artifacts
  volume_name:
    description: Volume that stores released wheel files
    default: wheel_release
  run_as:
    description: Service principal name used as run_as identity for production deployments

targets:
  user:
    mode: development
    workspace:
      root_path: /Workspace/Shared/${workspace.current_user.short_name}/.bundle/${bundle.name}/${bundle.target}
      artifact_path: /Volumes/${var.volume_catalog}/${var.volume_schema}/${var.volume_name}/${workspace.current_user.short_name}/artifacts
    variables:
      catalog: shared
      schema: bundle_artifacts
      release_version: ${workspace.current_user.short_name}
  shared:
    mode: production
    run_as:
      user_name: ${workspace.current_user.userName}
    workspace:
      root_path: /Workspace/Shared/${workspace.current_user.short_name}/.bundle/${bundle.name}/${bundle.target}
      artifact_path: /Volumes/${var.volume_catalog}/${var.volume_schema}/${var.volume_name}/${var.release_version}/bundle-artifacts
    variables:
      catalog: shared
      schema: bundle_artifacts

  dev:
    # Development target - jobs get '[dev username]' prefix, schedules are paused.
    # See https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Shared/${workspace.current_user.short_name}/.bundle/${bundle.name}/${bundle.target}
      artifact_path: /Volumes/${var.volume_catalog}/${var.volume_schema}/${var.volume_name}/${var.release_version}/bundle-artifacts
    variables:
      catalog: shared
      schema: bundle_artifacts

  prod:
    mode: production
    run_as:
      service_principal_name: ${var.run_as}
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
      artifact_path: /Volumes/${var.volume_catalog}/${var.volume_schema}/${var.volume_name}/${var.release_version}/bundle-artifacts
    variables:
      catalog: shared
      schema: bundle_artifacts